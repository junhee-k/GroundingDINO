# Minimal conda environment for GroundingDINO
# This file creates a base environment with Python and build tools.
# All Python dependencies (including PyTorch with CUDA support) are installed
# via 'pip install -e .' which uses setup.py and requirements.txt
name: dino
channels:
  - defaults
  - conda-forge
  - nvidia
dependencies:
  - python=3.10
  - pip
  # CUDA toolkit 12.8
  - cuda-toolkit=12.8

  # Optional: Jupyter for notebooks
  - jupyter
  - ipython
